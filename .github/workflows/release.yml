name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify generated semantic model
        run: |
          go generate ./internal/semanticmodel
          git diff --exit-code -- internal/semanticmodel/model.generated.json
          go vet ./...
          go test ./...
          go build ./...
          CGO_ENABLED=0 go build ./...

      - name: Build snapshot release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> 2"
          args: release --snapshot --clean

      - name: Smoke test packaged semantic model
        run: |
          set -e
          archive_path="$(find dist -type f -name 'throughline_*_linux_amd64.tar.gz' | head -n 1)"
          test -n "$archive_path"
          smoke_dir="$(mktemp -d)"
          tar -xzf "$archive_path" -C "$smoke_dir"
          binary_path="$(find "$smoke_dir" -type f -name throughline -perm -u+x | head -n 1)"
          test -n "$binary_path"

          export XDG_STATE_HOME="$(mktemp -d)"
          mkdir -p "$XDG_STATE_HOME/throughline"
          addr="127.0.0.1:43121"
          "$binary_path" mcp --addr "$addr" >"$smoke_dir/daemon.log" 2>&1 &
          daemon_pid=$!
          trap 'kill "$daemon_pid" 2>/dev/null || true' EXIT

          token_path="$XDG_STATE_HOME/throughline/credentials"
          for _ in $(seq 1 50); do
            [ -s "$token_path" ] && curl -fs "http://$addr/health" -H "Authorization: Bearer $(cat "$token_path")" >/dev/null 2>&1 && break
            sleep 0.2
          done
          test -s "$token_path"

          THROUGHLINE_SMOKE_ENDPOINT="http://$addr/mcp" THROUGHLINE_SMOKE_TOKEN="$(cat "$token_path")" \
            go run ./cmd/releasesmoke

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
